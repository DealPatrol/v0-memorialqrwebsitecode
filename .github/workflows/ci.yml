# Vercel production Deployment Checks follow the GitHub Actions job
# "build (22.x)" (and the matrix sibling "build (20.x)").
#
# The stock workflow ran `npx webpack`. This repository is a Next.js app and
# does not have webpack-cli, so that job failed on every run. After the
# workflow was removed, the required check was absent. Either way Vercel
# reports "Checks for Deployment have failed" and will not assign production
# domains, even when the Vercel build is READY.
#
# Keep the workflow name and the `build` job name so the existing Deployment
# Check still matches. Run lint and the project test suite instead of webpack.
# Node 18 is not in the matrix: production runs on Node 22, and on 8 Oct 2026
# Vercel had already failed the deployment check while "build (18.x)" was
# still running. Node 18 also cannot load scripts/test-env.ts.

name: NodeJS with Webpack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install, lint, and test
        run: |
          npm install -g pnpm@10.33.4
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test:fulfillment
